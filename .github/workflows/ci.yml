name: Build and smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86-64 build and interactive checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build original C implementation
        run: docker build --platform linux/amd64 --tag portfolio-smoke .
      - name: Run assertions against real executables
        run: docker run --rm --network none --pids-limit 256 portfolio-smoke python3 tests/smoke.py
